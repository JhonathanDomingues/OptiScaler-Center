name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.2)'
        required: true
        default: '0.1.2'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: |
          pyinstaller optiscaler-center.spec
      
      - name: Create ZIP archive
        run: |
          cd dist
          Compress-Archive -Path OptiScalerCenter -DestinationPath OptiScalerCenter-Windows-${{ github.event.inputs.version || github.ref_name }}.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxcb1
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: |
          pyinstaller optiscaler-center.spec
      
      - name: Create TAR.GZ archive
        run: |
          cd dist
          tar -czf OptiScalerCenter-Linux-${{ github.event.inputs.version || github.ref_name }}.tar.gz OptiScalerCenter/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.tar.gz
          retention-days: 5

  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts
      
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## OptiScaler Center ${{ github.event.inputs.version || github.ref_name }}
            
            ### 📥 Downloads
            
            - **Windows**: `OptiScalerCenter-Windows-*.zip`
            - **Linux**: `OptiScalerCenter-Linux-*.tar.gz`
            
            ### 📝 Instalação
            
            #### Windows
            1. Baixe o arquivo ZIP
            2. Extraia para uma pasta
            3. Execute `OptiScalerCenter.exe`
            
            #### Linux
            1. Baixe o arquivo TAR.GZ
            2. Extraia: `tar -xzf OptiScalerCenter-Linux-*.tar.gz`
            3. Execute: `./OptiScalerCenter/OptiScalerCenter`
            
            ### 🎯 Funcionalidades
            - Detecção automática de jogos Steam
            - Instalação do OptiScaler com backup automático
            - Interface moderna e intuitiva
            - Suporte para DLSS, FSR e XeSS
            
            ---
            
            Para mais informações, consulte o [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          files: |
            ./artifacts/*.zip
            ./artifacts/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
