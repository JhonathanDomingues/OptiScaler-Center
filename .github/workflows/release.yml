name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.2)'
        required: true
        default: '0.1.2'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: |
          pyinstaller optiscaler-center.spec
      
      - name: Create ZIP archive
        run: |
          cd dist
          Compress-Archive -Path OptiScalerCenter -DestinationPath OptiScalerCenter-Windows-${{ github.event.inputs.version || github.ref_name }}.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxcb1
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: |
          pyinstaller optiscaler-center.spec
      
      - name: Create TAR.GZ archive
        run: |
          cd dist
          tar -czf OptiScalerCenter-Linux-${{ github.event.inputs.version || github.ref_name }}.tar.gz OptiScalerCenter/
      
      - name: Install AppImage tools
        run: |
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
      
      - name: Create AppImage structure
        run: |
          # Criar estrutura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copiar executável
          cp -r dist/OptiScalerCenter/* AppDir/usr/bin/
          
          # Copiar arquivo desktop
          cp optiscaler-center.desktop AppDir/usr/share/applications/
          cp optiscaler-center.desktop AppDir/
          
          # Criar ícone simples (PNG de placeholder)
          # Para produção, substitua por um ícone real
          convert -size 256x256 xc:transparent \
            -fill '#1b2838' -draw 'roundrectangle 20,20 236,236 20,20' \
            -fill '#5c7e10' -draw 'circle 128,128 128,88' \
            AppDir/usr/share/icons/hicolor/256x256/apps/optiscaler-center.png || \
          echo "ImageMagick não disponível, usando ícone padrão"
          
          # Criar link simbólico para ícone
          ln -sf usr/share/icons/hicolor/256x256/apps/optiscaler-center.png AppDir/optiscaler-center.png || true
          
          # Criar AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          cd "${HERE}/usr/bin"
          exec "${HERE}/usr/bin/OptiScalerCenter" "$@"
          EOF
          
          chmod +x AppDir/AppRun
      
      - name: Build AppImage
        run: |
          # Criar AppImage
          ARCH=x86_64 appimagetool AppDir OptiScalerCenter-Linux-${{ github.event.inputs.version || github.ref_name }}.AppImage
          chmod +x OptiScalerCenter-Linux-${{ github.event.inputs.version || github.ref_name }}.AppImage
          mv OptiScalerCenter-Linux-${{ github.event.inputs.version || github.ref_name }}.AppImage dist/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          retention-days: 5

  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts
      
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## OptiScaler Center ${{ github.event.inputs.version || github.ref_name }}
            
            ### 📥 Downloads
            
            - **Windows**: `OptiScalerCenter-Windows-*.zip`
            - **Linux TAR.GZ**: `OptiScalerCenter-Linux-*.tar.gz`
            - **Linux AppImage**: `OptiScalerCenter-Linux-*.AppImage` ⭐ Recomendado
            
            ### 📝 Instalação
            
            #### Windows
            1. Baixe o arquivo ZIP
            2. Extraia para uma pasta
            3. Execute `OptiScalerCenter.exe`
            
            #### Linux (AppImage) - Recomendado
            1. Baixe o arquivo `.AppImage`
            2. Torne executável: `chmod +x OptiScalerCenter-Linux-*.AppImage`
            3. Execute: `./OptiScalerCenter-Linux-*.AppImage`
            
            Não requer instalação! Basta baixar e executar.
            
            #### Linux (TAR.GZ)
            1. Baixe o arquivo TAR.GZ
            2. Extraia: `tar -xzf OptiScalerCenter-Linux-*.tar.gz`
            3. Execute: `./OptiScalerCenter/OptiScalerCenter`
            
            ### 🎯 Funcionalidades
            - Detecção automática de jogos Steam
            - Instalação do OptiScaler com backup automático
            - Interface moderna e intuitiva
            - Suporte para DLSS, FSR e XeSS
            
            ---
            
            Para mais informações, consulte o [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          files: |
            ./artifacts/*.zip
            ./artifacts/*.tar.gz
            ./artifacts/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
